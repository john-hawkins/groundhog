[project]
name = "groundhog"
version = "0.1.0"
description = "Data Science Automation Meta-Harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.5",
    "reflex>=0.9.8.post1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
